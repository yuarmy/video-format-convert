name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: platforms;android-37.0
  ANDROID_BUILD_TOOLS: build-tools;36.0.0
  ANDROID_NDK: ndk;30.0.16248370
  ANDROID_CMAKE: cmake;3.22.1

jobs:
  checks:
    name: Lint 与单元测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # 虽然不跑原生构建，AGP 仍会在配置阶段校验 ndkVersion，缺 NDK 直接失败。
      - name: 安装 Android SDK 组件
        run: |
          sdkmanager="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install \
            "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "$ANDROID_CMAKE" "$ANDROID_NDK"

      # 仓库里的脚本没有可执行位（Windows 上开发），这里补上。
      - name: 修正脚本权限
        run: chmod +x gradlew scripts/*.sh

      - name: Lint 与单元测试
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest

      - name: 上传 Lint 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

  apk:
    name: 构建 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    needs: checks
    # 仓库 Secrets 里没有签名材料时，跳过 Release，只出 Debug APK。
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: 安装 Android SDK / NDK 组件
        run: |
          sdkmanager="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install \
            "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "$ANDROID_CMAKE" "$ANDROID_NDK"

      - name: 修正脚本权限
        run: chmod +x gradlew scripts/*.sh

      # FFmpeg 源码与静态库不入库，靠这里缓存。脚本或版本变了才重编。
      # 改了 ffmpeg-common.sh 里的版本号会自动失效；手动强制重编请改版本后缀。
      - name: 恢复 FFmpeg 源码与预编译库
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            ffmpeg/downloads
            ffmpeg/src
            ffmpeg/prebuilt
          key: ffmpeg-arm64-v8a-ndk30-v1-${{ hashFiles('scripts/ffmpeg-build.sh', 'scripts/ffmpeg-download.sh', 'scripts/lib/**') }}

      - name: 编译 FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          scripts/ffmpeg-download.sh
          scripts/ffmpeg-build.sh

      - name: 保存 FFmpeg 源码与预编译库
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ffmpeg/downloads
            ffmpeg/src
            ffmpeg/prebuilt
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: 构建 Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # keystore.properties 已在 .gitignore 中，只存在于本次 runner 的临时磁盘。
      - name: 写入发布签名
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: 构建 Release APK
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: ./gradlew --no-daemon assembleRelease

      - name: 校验 Release 签名
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          apksigner="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | tail -1)"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: 上传 Release APK
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
